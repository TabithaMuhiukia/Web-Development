<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API App</title>
    <link rel="stylesheet" href="stylingWeatherApp.css">
    <script src="WeatherApp.js" defer></script>
    <!--Import Google Icons-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search"/>
</head>
<body>
    <main class ="main-container">

        <header class="input-container">
            <input class="city-input" placeholder="search city" type ="text">
            <button class="search-button">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
            <span class="error-message"></span>
        </header>
        <section class="weather-info" style="display:none;">
            <div class="location-data-container">
                <div class="location">
                <span class="material-symbols-outlined">
                    location_on
                </span>
                </div>
            </div>
                <div>
                <h4 class ="country-text" regular-txt>Nairobi</h4>
                </div>
                <div>
                <h5 class="current-date">Friday, 18 June 2025</h5>
                </div>
            </div>

            <div class ="weather-summary-container">
                <div class="weather-icon">
                    <img src="weather\clouds.svg" alt="">
                </div>
                <div class ="weather-summary-info">
                    <h1 class= "temp-txt">29 °C</h1>
                    <h3 class ="condition-txt regular-txt">Clouds</h3>
            </div>

            </div>
                <div class ="weather-condition-container">
                    <div class="condition-item">
                        <span class="material-symbols-outlined">
                        water drop
                        </span>
                    </div>

                    <div class="condition-info">
                    <h5 class ="condition-txt regular-txt">humidity</h5>
                    <h4 class ="humidity-value-txt">55%</h4>
                    </div>

                    <div class="condition-info">
                        <span class="material-symbols-outlined">
                        air
                        </span>
                    </div>

                    <div class="condition-info">
                    <h5 class ="condition-txt regular-txt">wind speed</h5>
                    <h4 class ="wind-value-txt">2m/s</h4>
                    </div>
            </div>

                <div class="forecast-item-container"></div>
                    <div class ="forecast-item">
                    <h5 class ="forecast-item-date regular-txt">01 June</h5>
                    <img src="weather\thunderstorm.svg" class ="forecast-item-image">
                    <h5 class="forecast-item-temp">29 °C</h5>
                    </div>

                    <div class ="forecast-item">
                    <h5 class ="forecast-item-date regular-txt">02 June</h5>
                    <img src="weather\thunderstorm.svg" class ="forecast-item-image">
                    <h5 class="forecast-item-temp">25 °C</h5>
                    </div>

                    <div class ="forecast-item">
                    <h5 class ="forecast-item-date regular-txt">03 June</h5>
                    <img src="weather\thunderstorm.svg" class ="forecast-item-image">
                    <h5 class="forecast-item-temp">20 °C</h5>
                    </div>
                </div>
       </section>
        <section class="search-city-section-message">
            <img class ="message-img" src="message\search-city.png">
            <div>
                <h1>Search City</h1>
                <h4 class="regular-txt">
                    find out the weather conditions of the city
                </h4>
            </div>
        </section>

        </section>
        <section class="not-found-section-message" style="display:none;">
            <img class ="message-img" src="message\not-found.png">
            <div>
                <h1>Search City</h1>
                <h4 class="regular-txt">
                    find out the weather conditions of the city
                </h4>
            </div>
        </section>
        </main>
</body>
</html>
