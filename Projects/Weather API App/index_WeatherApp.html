<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="stylingWeatherApp.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search"/>
</head>
<body>
  <main class="main-container">
    
    <!-- Header Input -->
    <header class="input-container">
      <input class="city-input" placeholder="Search city" type="text" />
      <button class="search-button">
        <span class="material-symbols-outlined">search</span>
      </button>
      <span class="error-message"></span>
    </header>

    <!-- Weather Info Section -->
    <section class="weather-info" style="display: none;">
      <div class="location-data-container">
        <div class="location">
          <span class="material-symbols-outlined" style="font-size: 10px;">add-location></span>
          <h4 class="country-text regular-txt">Nairobi</h4>
        </div>
        <h5 class="current-date">Friday, 18 June 2025</h5>
      </div>

      <div class="weather-summary-container">
        <img class="weather-summary-img" src="weather/clouds.svg" alt="Weather Icon" />
        <div class="weather-summary-info">
          <h1 class="temp-txt">29 °C</h1>
          <h3 class="condition-txt regular-txt">clouds</h3>
        </div>
      </div>

      <div class="weather-condition-container">
        <div class="condition-item">
        <span class="material-symbols-outlined" style="font-size: 14px;">water_drop</span>
          <div class="condition-info">
            <h5 class="condition-txt regular-txt">humidity</h5>
            <h4 class="humidity-value-txt">55%</h4>
          </div>
        </div>

        <div class="condition-item">
          <span class="material-symbols-outlined" style="font-size: 14px;">air</span>
          <div class="condition-info">
            <h5 class="condition-txt regular-txt">wind speed</h5>
            <h4 class="wind-value-txt">2m/s</h4>
          </div>
        </div>
      </div>

      <!-- Forecast section (populated dynamically) -->
      <div class="forecast-item-container">
        <!-- Forecast items will be injected here -->
      </div>
    </section>

    <!-- Default search city section -->
    <section class="search-city-section-message">
      <img class="message-img" src="message/search-city.png" alt="Search Prompt" />
      <div>
        <h1>Search City</h1>
        <h4 class="regular-txt">Find out the weather conditions of the city</h4>
      </div>
    </section>

    <!-- Not found message section -->
    <section class="not-found-section-message" style="display: none;">
      <img class="message-img" src="message/not-found.png" alt="Not Found" />
      <div>
        <h1>City Not Found</h1>
        <h4 class="regular-txt">Please check the spelling or try a different city</h4>
      </div>
    </section>

  </main>

  <!-- Link your JavaScript file -->
  <script src="WeatherApp.js" defer></script>
</body>
</html>
